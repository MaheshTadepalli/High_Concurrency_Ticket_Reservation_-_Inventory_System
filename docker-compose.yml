services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_pg
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d tickets"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
